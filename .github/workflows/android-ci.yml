name: Build & Release PayPing

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1). Leave empty to use version.properties'
        required: false
        type: string
      create_release:
        description: 'Create or update GitHub Release'
        required: false
        default: true
        type: boolean

concurrency:
  group: payping-${{ github.event_name == 'pull_request' && github.head_ref || 'main-release' }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, Build & Release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          FILE_VERSION=""
          if [[ -f version.properties ]]; then
            FILE_VERSION=$(grep -E '^VERSION_NAME=' version.properties | head -n1 | cut -d'=' -f2- | tr -d '\r' | xargs || true)
          fi
          FILE_VERSION="${FILE_VERSION:-1.0.0}"

          EVENT_NAME="${{ github.event_name }}"
          REF_NAME="${{ github.ref_name }}"
          INPUT_VERSION=$(echo "${{ inputs.version }}" | tr -d '\r' | xargs)

          IS_TAG=false
          IS_DISPATCH=false
          VERSION_NAME="$FILE_VERSION"

          if [[ "$EVENT_NAME" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            IS_TAG=true
            VERSION_NAME="${REF_NAME#v}"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            IS_DISPATCH=true
            if [[ -n "$INPUT_VERSION" ]]; then
              VERSION_NAME="${INPUT_VERSION#v}"
            fi
          fi

          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION_NAME'. Expected semantic format like 1.0.0"
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "file_version=$FILE_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_tag=$IS_TAG" >> "$GITHUB_OUTPUT"
          echo "is_dispatch=$IS_DISPATCH" >> "$GITHUB_OUTPUT"
          echo "Resolved PayPing v$VERSION_NAME (buildNumber=${{ github.run_number }})"

      - name: Sync version.properties and tag on manual release
        if: steps.version.outputs.is_dispatch == 'true' && (inputs.create_release == true || inputs.create_release == 'true')
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          FILE_VERSION="${{ steps.version.outputs.file_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$VERSION_NAME" != "$FILE_VERSION" ]]; then
            echo "VERSION_NAME=$VERSION_NAME" > version.properties
            git add version.properties
            git commit -m "Bump version to $VERSION_NAME [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          fi

      - name: Run unit tests
        run: gradle testDebugUnitTest -PversionName=${{ steps.version.outputs.version_name }} -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Build Debug APKs
        run: gradle assembleDebug -PversionName=${{ steps.version.outputs.version_name }} -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Check Release signing secrets
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" ]]; then
            echo "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ steps.version.outputs.is_tag }}" == "true" || ( "${{ steps.version.outputs.is_dispatch }}" == "true" && "${{ inputs.create_release }}" == "true" ) ]]; then
              echo "::error::Missing release signing secrets (SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD)."
              exit 1
            else
              echo "::warning::Release signing secrets are not configured yet. Skipping signed Release APKs and GitHub Release upload."
            fi
          fi

      - name: Build signed Release APKs (Universal, ARMv8, ARMv7, x64)
        if: github.event_name != 'pull_request' && steps.signing.outputs.available == 'true'
        env:
          SIGNING_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            -PversionName=${{ steps.version.outputs.version_name }} \
            -PbuildNumber=${{ github.run_number }} \
            --stacktrace

      - name: Prepare named APK assets
        if: github.event_name != 'pull_request' && steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="app/build/outputs/apk/release"
          ls -lh "$OUT_DIR"
          rm -rf dist
          mkdir -p dist

          cp "$OUT_DIR/app-universal-release.apk" "dist/payping-universal.apk"
          cp "$OUT_DIR/app-arm64-v8a-release.apk" "dist/payping-arm64-v8a.apk"
          cp "$OUT_DIR/app-armeabi-v7a-release.apk" "dist/payping-armeabi-v7a.apk"
          cp "$OUT_DIR/app-x86_64-release.apk" "dist/payping-x86_64.apk"

          ls -lh dist/

      - name: Upload Release APKs as workflow artifacts
        if: github.event_name != 'pull_request' && steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: payping-release-apks
          path: dist/*.apk
          retention-days: 30

      - name: Publish or update GitHub Release
        if: github.event_name != 'pull_request' && steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          IS_TAG="${{ steps.version.outputs.is_tag }}"
          IS_DISPATCH="${{ steps.version.outputs.is_dispatch }}"
          CREATE_RELEASE="${{ inputs.create_release }}"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Updating existing release $TAG_NAME with fresh APKs..."
            gh release upload "$TAG_NAME" dist/*.apk --clobber
          elif [[ "$IS_TAG" == "true" || ( "$IS_DISPATCH" == "true" && "$CREATE_RELEASE" == "true" ) ]]; then
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" dist/*.apk \
              --title "PayPing $TAG_NAME" \
              --generate-notes
          else
            echo "Release $TAG_NAME does not exist yet; skipping release creation on regular push."
          fi
